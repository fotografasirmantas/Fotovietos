<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FotoVietos — Irmanto Juzėno fotografijos vietos</title>
<meta name="description" content="Fotografo Irmanto Juzėno aplankytos vietos, kur fotografuoti gražius kadrus. Susiję straipsniai, Instagram @fotografas_irmantas">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a3c34">
<style>
*,::before,::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;tab-size:4}
body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;line-height:1.5;color:#1f2a27;background:#f4f1eb}
h1,h2,p,ul{margin:0}
ul{padding:0;list-style:none}
button,input{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0}
button{cursor:pointer}
a{color:#1a3c34;text-decoration:none}
a:hover{text-decoration:underline}
img{display:block;max-width:100%;height:auto}
.container{max-width:1200px;margin:0 auto;padding:0 20px}
header{background:#1a3c34;color:#f4f1eb;padding:20px 0;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px rgba(0,0,0,.1)}
header h1{font-size:clamp(1.5rem,4vw,2rem);font-weight:700;margin-bottom:8px}
header p{font-size:clamp(0.9rem,2.5vw,1rem);opacity:.9}
.lang-switch{display:flex;gap:8px;margin-top:12px}
.lang-switch button{background:#2d5348;color:#f4f1eb;border-radius:6px;padding:6px 14px;font-size:0.9rem;font-weight:600;transition:background .2s}
.lang-switch button:hover,.lang-switch button:focus-visible{background:#3d6958}
.lang-switch button.active{background:#c9973f}
main{padding:40px 0}
.filter{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:30px}
.filter button{background:#fff;border:2px solid #d9d2c3;border-radius:10px;padding:10px 18px;font-weight:600;transition:all .2s}
.filter button:hover,.filter button:focus-visible{border-color:#c9973f;background:#fffbf5}
.filter button.active{background:#1a3c34;color:#f4f1eb;border-color:#1a3c34}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 12px rgba(0,0,0,.08);transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 20px rgba(0,0,0,.12)}
.card img{width:100%;aspect-ratio:4/3;object-fit:cover}
.card-body{padding:16px}
.card h2{font-size:1.2rem;font-weight:700;margin-bottom:8px}
.card p{font-size:0.95rem;color:#5a6760;margin-bottom:12px}
.card-footer{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-block;background:#e8e4db;color:#1f2a27;border-radius:6px;padding:4px 10px;font-size:0.85rem;font-weight:600}
footer{background:#1a3c34;color:#f4f1eb;padding:30px 0;margin-top:60px;text-align:center}
footer a{color:#c9973f}
</style>
</head>
<body>

<header>
<div class="container">
<h1 id="header-title">FotoVietos</h1>
<p id="header-subtitle">Irmanto Juzėno fotografijos vietos</p>
<div class="lang-switch">
<button type="button" data-lang="lt">Lietuviškai</button>
<button type="button" data-lang="en">English</button>
<button type="button" data-lang="ru">Русский</button>
</div>
</div>
</header>

<main>
<div class="container">
<div class="filter" id="filter"></div>
<div class="grid" id="grid"></div>
</div>
</main>

<footer>
<div class="container">
<p>&copy; 2025 Irmantas Juzėnas · Instagram: <a href="https://instagram.com/fotografas_irmantas" target="_blank" rel="noopener">@fotografas_irmantas</a></p>
</div>
</footer>

<script src="vietos.js?v=8"></script>
<script src="vertimai.js?v=2"></script>

</body>
</html>
