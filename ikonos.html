<!DOCTYPE html>
<html lang="lt">
<head><meta charset="utf-8"><title>Ikonėlių kūrimas</title></head>
<body style="font-family:system-ui;padding:20px">
<h1>Ikonėlių kūrimas</h1>
<p>Paspauskite abi nuorodas. Atsisiųs failus icon-192.png ir icon-512.png.</p>
<div id="out"></div>
<script>
const out = document.getElementById("out");
const img = new Image();
img.onload = () => {
  [192, 512].forEach(size => {
    const canvas = document.createElement("canvas");
    canvas.width = canvas.height = size;
    canvas.getContext("2d").drawImage(img, 0, 0, size, size);
    const link = document.createElement("a");
    link.href = canvas.toDataURL("image/png");
    link.download = `icon-${size}.png`;
    link.textContent = `Atsisiųsti icon-${size}.png`;
    link.style.cssText = "display:block;margin:14px 0;font-size:20px";
    out.append(link);
  });
};
img.onerror = () => { out.textContent = "Nerastas icon.svg. Jis turi būti tame pačiame projekte."; };
img.src = "icon.svg";
</script>
</body>
</html>
